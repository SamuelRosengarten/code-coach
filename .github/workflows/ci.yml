name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-coach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code-coach/package-lock.json

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      # Runs the extension inside a real VS Code instance under a virtual
      # display, so the hover, activation and log-writing behavior is
      # exercised end to end rather than only through unit tests.
      - name: Tests (VS Code Extension Host)
        run: xvfb-run -a npm test
